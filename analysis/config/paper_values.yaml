# ---- Section 1.5 / SI Fig. S4: cluster-based permutation tests (best cluster per run and band) --------------------------
# Paper (text, Fig. S4): Longer / time-locked theta p = 0.028 (1714 px), alpha p = 0.499 (70 px); phase-locked theta p = 0.343 (147 px),
# alpha p = 0.047 (326 px).  The 4-decimal p-values (and the traditional-2s run, the sensitivity runs and the colour scale |t| max = 3.702) are
# typed from the saved OUTPUT of analysis-notebook cells 124, 125, 127 and 128 (the paper prints 3 decimals).
cluster_perm:
  p_tol: 0.0006
  global_vmax: 3.702
  runs:
    1_traditional_2s: {theta: {p: 0.6464}, alpha: {p: 1.0}}
    2_longer_5050:    {theta: {p: 0.0280, n_pixels: 1714}, alpha: {p: 0.4985, n_pixels: 70}}
    3_phase_locked:   {theta: {p: 0.3427, n_pixels: 147},  alpha: {p: 0.0470, n_pixels: 326}}
  sensitivity:                      # wider bands, phase-locked (notebook cells 124-125)
    theta_3_9_inhale:        {p: 0.3876}
    alpha_beta_7_13_exhale:  {p: 0.0579}

