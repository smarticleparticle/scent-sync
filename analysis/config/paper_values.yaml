  - [0.0, 10.4, 35.4, 39.5]
  - [0.0,  6.2, 100.0, 100.0]
  - [64.7, 87.7, 35.2, 22.7]
fig4a_time:                                  # Longer (3.78 s, 4-bin) ERSP
  - [5.9, 5.9, 19.6, 9.8]
  - [7.8, 9.8, 31.4, 7.8]
  - [31.4, 98.0, 37.3, 70.6]

# ---- Fig. S3: per-odor selection frequency (%); rows Beta, Alpha, Theta; columns = 4 phase bins -------------
fig_s3:
  peppermint: [[0, 0, 100, 100], [0, 0, 100, 100], [100, 100, 94, 31]]
  oregano:    [[0, 0, 0, 6],     [0, 0, 100, 100], [94, 88, 12, 12]]
  citrus:     [[0, 31, 6, 12],   [0, 19, 100, 100], [0, 75, 0, 25]]

# ---- Section 1.7 / Fig. 5: habituation ----------------------------------------------------------------------
habituation:
  per_odor:        # n, delta AUC and FDR p from Section 1.7; AUCs (on subjects with BOTH blocks) from the Fig. 5 caption
    peppermint: {n: 14, delta_auc: 0.327, p_fdr: 0.022, early_auc_common: 0.786, late_auc_common: 0.459}
    oregano:    {n: 14, delta_auc: 0.255, p_fdr: 0.040, early_auc_common: 0.674, late_auc_common: 0.418}
    citrus:     {n: 13, delta_auc: 0.249, p_fdr: 0.022, early_auc_common: 0.651, late_auc_common: 0.402}
  pooled: {n: 41, delta_auc: 0.274, p_fdr_below: 0.001}
  # Section 1.7: "alpha late exhale (270-360) dropped by 83%, theta late inhale (90-180) by 53%" (Fig. 5B convention)
  selection_drop_pct: {alpha_p270_360: 83, theta_p90_180: 53}

# ---- Section 1.1 / Fig. 2: respiration-EEG phase-amplitude coupling (n = 17) ------------------------------------------
# whole-head p = FDR-corrected one-sided sign-flip permutation p (50,000 flips); d = one-sample Cohen's d of the subject z-scores
pac:
  n_subjects: 17
  whole_head:
    theta:     {p: 0.232, d: 0.19}
    alpha:     {p: 0.043, d: 0.48}
    beta:      {p: 0.043, d: 0.50}
    low_gamma: {p: 0.011, d: 0.80}
  clusters:                      # significant spatial clusters (p, number of channels), Fig. 2B
    theta: []
    alpha: [{p: 0.022, n: 23}, {p: 0.040, n: 18}]
    beta: []
    low_gamma: [{p: 0.001, n: 48}]

# ---- Section 1.2 / Table S2 / Fig. S2: oscillatory basis of the PAC effects -------------------------------------------
# peak prevalence at the default FOOOF setting (2.0 SD, 1-12 Hz peak width); gated results restrict each subject to channels
# with a peak in the band (>= 20 channels needed).  p = FDR-corrected (assumed -- the checks will tell if the paper used raw p).
fooof:
  n_instances: 1974
  peak_prevalence_pct: {alpha: 82.3, beta: 77.8, theta: 35.6, low_gamma: 32.4}
  gated_default:
    theta:     {n: 12, d: 0.15, p: 0.314}
    alpha:     {n: 15, d: 0.48, p: 0.085}
    beta:      {n: 16, d: 0.54, p: 0.083}
    low_gamma: {n: 8,  d: 0.55, p: 0.109}
  paired_gated_vs_all_p: {alpha: 0.092, beta: 0.288}
  table_s2:                       # peak threshold (SD) -> band -> [Cohen's d, n subjects]
    "1.5": {theta: [0.12, 13], alpha: [0.48, 15], beta: [0.50, 17], low_gamma: [0.88, 14]}
    "2.0": {theta: [0.15, 12], alpha: [0.48, 15], beta: [0.54, 16], low_gamma: [0.55, 8]}
    "2.5": {theta: [0.16, 9],  alpha: [0.52, 15], beta: [0.48, 14], low_gamma: [0.35, 6]}
    "3.0": {theta: [0.47, 4],  alpha: [0.57, 13], beta: [0.47, 9],  low_gamma: [-1.58, 3]}
  table_s2_beta_p_fdr_at_1_5: 0.049
  aperiodic:                      # inhale minus exhale, two-sided sign-flip test
    exponent: {d: 0.59, p: 0.029}
    offset: {p: 0.124}

