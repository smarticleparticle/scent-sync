# Numbers PUBLISHED in the paper, used as regression targets (results/*/..._checks.csv).
# Source of every block is given next to it.  Typed from the PDF draft of 10 Sep 2026 -- if a value
# changes in the paper, change it here.  Tolerances reflect the rounding used in the paper.

tolerance:
  auc: 0.001          # AUCs are printed with 3 decimals
  p: 0.002
  pct_fig4a: 0.15     # Fig. 4A prints one decimal
  pct_figS3: 1.0      # Fig. S3 prints integers

# ---- Table S1: AUC by representation and binning strategy ---------------------------------------------
table_s1:
  peppermint:
    traditional: {"1-bin (full)": 0.467, "2-bin": 0.696, "4-bin": 0.581}
    longer:      {"1-bin (full)": 0.429, "2-bin": 0.325, "4-bin": 0.495}
    rpl:         {"1-bin (full)": 0.414, "2-bin": 0.453, "4-bin": 0.785}
  oregano:
    traditional: {"1-bin (full)": 0.443, "2-bin": 0.495, "4-bin": 0.426}
    longer:      {"1-bin (full)": 0.450, "2-bin": 0.484, "4-bin": 0.595}
    rpl:         {"1-bin (full)": 0.388, "2-bin": 0.346, "4-bin": 0.671}
  citrus:                                   # "grapefruit" in the paper
    traditional: {"1-bin (full)": 0.554, "2-bin": 0.533, "4-bin": 0.557}
    longer:      {"1-bin (full)": 0.478, "2-bin": 0.474, "4-bin": 0.613}
    rpl:         {"1-bin (full)": 0.481, "2-bin": 0.508, "4-bin": 0.617}

# ---- Table S4: paired permutation tests on decision-value gaps (FDR over the 6 comparisons) ---------------
table_s4:
  - {odor: peppermint, comparison: phase_vs_traditional, n: 16, observed_diff: 0.116, p_raw: 0.022, p_fdr: 0.044}
  - {odor: peppermint, comparison: phase_vs_longer,      n: 16, observed_diff: 0.155, p_raw: 0.014, p_fdr: 0.044}
  - {odor: oregano,    comparison: phase_vs_traditional, n: 17, observed_diff: 0.087, p_raw: 0.020, p_fdr: 0.044}
  - {odor: oregano,    comparison: phase_vs_longer,      n: 17, observed_diff: 0.045, p_raw: 0.299, p_fdr: 0.448}
  - {odor: citrus,     comparison: phase_vs_traditional, n: 16, observed_diff: 0.004, p_raw: 0.920, p_fdr: 0.933}
  - {odor: citrus,     comparison: phase_vs_longer,      n: 16, observed_diff: 0.003, p_raw: 0.933, p_fdr: 0.933}

# ---- Fig. 4A: selection frequency (%), mean over the 3 odors; rows Beta, Alpha, Theta; columns = 4 bins ------
