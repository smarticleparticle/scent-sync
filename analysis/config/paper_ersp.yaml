# Run stages 2-4 (classification, habituation, Fig 4, Fig 5) from the paper's OWN ERSP files, without recomputing them.
# Put copies of the three files at results_paper/ersp/ (names below), then:
#   snakemake -c4 --configfile config/paper_ersp.yaml
