#   phase_aligned_results_fullbreath_frontal_temporal_1deg_trials.npy  ->  results_paper/ersp/phase_aligned_fullbreath_1deg.npy
#   timealigned_ersp_results_avgbreath.npy                             ->  results_paper/ersp/time_aligned_long.npy    (3.78 s)
#   sniff_triggered_ersp_results_avgbreath.npy                         ->  results_paper/ersp/time_aligned_short.npy   (2 s)
paths:
  results: results_paper
  figures: figures_paper
