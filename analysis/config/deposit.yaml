# Reproduce the paper from the DATA DEPOSIT (no raw EEG, no continuous EEG needed):
#
#   1. put the deposit files in data/preprocessed/ (see DEPOSIT.md; `python scripts/verify_data.py` checks them)
#   2. snakemake --configfile config/deposit.yaml -c4 --keep-going
#
# Only differences from config/config.yaml: the PAC results ship in the slimmed form (per-surrogate arrays dropped), and the free-response
# analysis (needs `pip install sentence-transformers` and a one-time model download) is switched on, and the odor-arrival timing check (Section 1.8) is switched off.  To skip that last stage:
#   snakemake --configfile config/deposit.yaml config/no_word_scoring.yaml -c4
paths:
  pac_results: data/preprocessed/pac_results_slim.npy
word_scoring:
  run: true
timing:
  run: false             # odor-arrival timing (Section 1.8, Tables S5-S6) needs whole-session respiration recordings, which are not in the deposit (available on request)
