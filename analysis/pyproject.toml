[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "olfaction-eeg"
version = "0.1.0"
description = "Respiratory-phase-locked EEG responses to odors: analysis code"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "pyyaml", "matplotlib"]

[project.optional-dependencies]
recordings = ["mne", "h5py"]            # raw EEGLAB/CSV -> epochs (stage 0)
ersp = ["mne", "pywavelets", "fire"]    # scripts/generate_ersp.py (stage 1)

[tool.setuptools.packages.find]
where = ["src"]
