# NOTE: written without access to GitHub -- check the first run.
name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (the hosted runner is small)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - name: Leave out the language-model packages in CI (several GB; the tests use a stand-in model)
        run: sed -i -e '/- sentence-transformers==/d' -e '/- transformers==/d' -e '/- torch==/d' analysis/environment.yml
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: analysis/environment.yml
          activate-environment: olfaction-eeg
          miniforge-version: latest
      - name: Unit tests
        shell: bash -el {0}
        working-directory: analysis
        run: pytest -q tests
      - name: Synthetic end-to-end smoke test (raw -> epochs -> ERSP -> all stages -> figures)
        shell: bash -el {0}
        working-directory: analysis
        run: |
          python tests/make_synthetic_raw.py tests/data/raw tests/data/preprocessed/info --n-trials 9
          snakemake --configfile config/test.yaml -c2
